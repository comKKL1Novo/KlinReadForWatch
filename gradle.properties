org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Pin the JDK Gradle itself runs on.
#
# Android Studio defaults this project's Gradle JDK to GRADLE_LOCAL_JAVA_HOME,
# which resolves from this very property. With it unset, Sync cannot start and
# the Run button stays greyed out even when a device is connected.
#
# The path is Android Studio's bundled JetBrains Runtime (OpenJDK 21). If the
# project is opened on another machine, change this or set the Gradle JDK in
# Settings > Build, Execution, Deployment > Build Tools > Gradle.
org.gradle.java.home=C\:\\Software\\AndroidStudio\\jbr

android.useAndroidX=true
android.nonTransitiveRClass=true

# The project sits under a path containing non-ASCII characters
# ("新建文件夹 (2)"), which Android Gradle Plugin rejects by default because
# NDK/AAPT2 have historically broken on such paths under Windows.
#
# The verified-working location is C:\Dev\LongzuReader (pure ASCII). Building
# from the Desktop folder relies on this override; if you hit odd resource or
# native-tool failures, move the project to an ASCII path instead of debugging.
android.overridePathCheck=true

# AGP 8.7.3 was tested up to compileSdk 35; this project targets 36.
# Only a warning, but it is expected and harmless.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
